name: hadix

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Configure .env}
      API_DOMAIN: ${API_DOMAIN:?Configure .env}
      DRIVE_DOMAIN: ${DRIVE_DOMAIN:?Configure .env}
      AI_DOMAIN: ${AI_DOMAIN:?Configure .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./panel:/srv/panel:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.30.60.2
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  api:
    build: ./api
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      API_TOKEN: ${API_TOKEN:?Configure .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-2048}
      IMAGE_MODEL: ${IMAGE_MODEL:-flux}
      DRIVE_DOMAIN: ${DRIVE_DOMAIN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    networks: [edge, inference]
    mem_limit: 384m
    cpus: 0.5
    logging: *logging

  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
      OLLAMA_CONTEXT_LENGTH: '2048'
      OLLAMA_KEEP_ALIVE: 5m
    volumes: [ollama_data:/root/.ollama]
    networks: [inference]
    mem_limit: 12g
    cpus: 3.0
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    mem_limit: 1g
    cpus: 0.75
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nextcloud -d nextcloud']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '192mb', '--maxmemory-policy', 'noeviction']
    networks: [data]
    mem_limit: 256m
    cpus: 0.25
    logging: *logging

  nextcloud:
    image: nextcloud:32.0.15-apache
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment: &nextcloud-env
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: hadix-admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Configure .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${DRIVE_DOMAIN}
      TRUSTED_PROXIES: 172.30.60.2
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${DRIVE_DOMAIN}
      OVERWRITECLIURL: https://${DRIVE_DOMAIN}
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
      APACHE_BODY_LIMIT: '2147483648'
      HADIX_DRIVE_USER: hadix
      HADIX_DRIVE_PASSWORD: ${DRIVE_PASSWORD:?Configure .env}
      HADIX_DRIVE_QUOTA: ${DRIVE_QUOTA:-20 GB}
    volumes: &nextcloud-volumes
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
      - ./scripts/setup-drive.php:/opt/hadix/setup-drive.php:ro
    networks: [edge, data]
    mem_limit: 3g
    cpus: 1.5
    logging: *logging

  cron:
    image: nextcloud:32.0.15-apache
    restart: unless-stopped
    entrypoint: /cron.sh
    environment: *nextcloud-env
    volumes: *nextcloud-volumes
    networks: [data]
    depends_on: [nextcloud]
    mem_limit: 768m
    cpus: 0.5
    logging: *logging

networks:
  edge:
    ipam:
      config: [{ subnet: 172.30.60.0/24 }]
  # Egress is needed to download models; no inference service publishes host ports.
  inference: {}
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  ollama_data:
  postgres_data:
  nextcloud_html:
  nextcloud_data:
